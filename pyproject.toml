[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "twintrade"
version = "0.1.0"
description = "Simulation of trading assets whose values fluctuate randomly"
readme = "README.md"
authors = [{ name = "TwinTrade Contributors" }]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "matplotlib",
    "rich",
]

[project.scripts]
twintrade = "twintrade.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
